<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DiecastZone - Login</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#a7000a",
              "primary-hover": "#8f0008",
              "ink-black": "#1A1A1A",
              surface: "#f9f9f9",
              "surface-white": "#ffffff",
              secondary: "#666666",
              border: "#d8d8d8",
            },

            fontFamily: {
              headline: ["Hanken Grotesk"],
              body: ["Hanken Grotesk"],
              mono: ["JetBrains Mono"],
            },

            borderRadius: {
              dz: "4px",
            },
          },
        },
      };
    </script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Hanken Grotesk", sans-serif;
      }

      button,
      input {
        font-family: inherit;
      }

      .auth-panel {
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }

      .hidden-panel {
        display: none;
      }

      .social-button {
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .social-button:hover {
        background-color: #f5f5f5;
        border-color: #999;
      }

      .social-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
    </style>
  </head>

  <body class="min-h-screen bg-surface text-ink-black flex flex-col">
    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->

    <main class="flex-1 relative flex items-center justify-center px-4 py-12">
      <!-- Background -->
      <div
        class="absolute inset-0 pointer-events-none"
        style="
          background:
            radial-gradient(
              circle at 10% 15%,
              rgba(167, 0, 10, 0.07),
              transparent 35%
            ),
            radial-gradient(
              circle at 90% 85%,
              rgba(0, 0, 0, 0.05),
              transparent 35%
            );
        "
      ></div>

      <!-- ========================= -->
      <!-- AUTH CARD -->
      <!-- ========================= -->

      <section
        class="relative z-10 w-full max-w-[440px] bg-white border border-border rounded-dz shadow-sm"
      >
        <!-- Card content -->
        <div class="p-6 sm:p-8">
          <!-- Logo -->
          <div class="flex flex-col items-center mb-7">
            <div class="w-20 h-20 flex items-center justify-center mb-4">
              <img
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuB62tX9FBDdqYywFMobtla7On49rbKAkHy4oXuHoZrjjsa_2Lygh7FSlpVH1946QcSOX3y9HtuDTEFI9I6BPKOBfRZaA1AMjsPuKAkmExHDKi0K4liWOpL-4runV7dkHivrxWeMQnDAU2S-QKesC-1-fpRCN84K4c5xhXNjqaw4nVdBZn4RelKgNHgmpzTvY_uHJR8V3jodw5KwuCJFUUSo6RWvkgQU1gx-86b3zlT_eIBSVJdyyShLWQ"
                alt="DiecastZone"
                class="w-full h-full object-contain"
              />
            </div>

            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">
              DIECAST ZONE
            </h1>

            <p class="mt-1 text-sm text-secondary">
              Engineered for collectors.
            </p>
          </div>

          <!-- ========================= -->
          <!-- TABS -->
          <!-- ========================= -->

          <div class="flex border-b border-border mb-7">
            <button
              id="btn-login"
              type="button"
              class="flex-1 pb-3 text-sm font-semibold border-b-2 border-primary text-primary transition-colors"
            >
              LOGIN
            </button>

            <button
              id="btn-register"
              type="button"
              class="flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-secondary hover:text-ink-black transition-colors"
            >
              REGISTER
            </button>
          </div>

          <!-- ========================= -->
          <!-- MESSAGE -->
          <!-- ========================= -->

          <div
            id="auth-message"
            class="hidden mb-5 px-4 py-3 text-sm border rounded-dz"
          ></div>

          <!-- ========================= -->
          <!-- LOGIN -->
          <!-- ========================= -->

          <div id="login-panel" class="auth-panel">
            <form id="form-login" class="space-y-5">
              <!-- Email -->
              <div>
                <label
                  for="login-email"
                  class="block mb-2 text-xs font-semibold font-mono uppercase tracking-wide"
                >
                  Email Address
                </label>

                <input
                  id="login-email"
                  type="email"
                  autocomplete="email"
                  placeholder="collector@diecastzone.com"
                  required
                  class="w-full h-12 px-4 bg-surface border border-ink-black rounded-dz outline-none focus:border-primary focus:ring-1 focus:ring-primary transition"
                />
              </div>

              <!-- Password -->
              <div>
                <label
                  for="login-password"
                  class="block mb-2 text-xs font-semibold font-mono uppercase tracking-wide"
                >
                  Password
                </label>

                <input
                  id="login-password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="••••••••"
                  required
                  class="w-full h-12 px-4 bg-surface border border-ink-black rounded-dz outline-none focus:border-primary focus:ring-1 focus:ring-primary transition"
                />
              </div>

              <!-- Remember -->
              <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 text-sm text-secondary">
                  <input
                    id="remember-me"
                    type="checkbox"
                    class="w-4 h-4 accent-[#a7000a]"
                  />
                  Remember me
                </label>
              </div>

              <!-- Login button -->
              <button
                id="login-submit"
                type="submit"
                class="w-full h-12 bg-primary hover:bg-primary-hover text-white font-mono text-sm font-semibold rounded-dz transition flex items-center justify-center"
              >
                SIGN IN
              </button>
            </form>

            <!-- Divider -->

            <div class="flex items-center gap-3 my-6">
              <div class="h-px flex-1 bg-border"></div>

              <span
                class="text-[11px] text-gray-400 font-mono uppercase whitespace-nowrap"
              >
                Or continue with
              </span>

              <div class="h-px flex-1 bg-border"></div>
            </div>

            <!-- Social Login -->

            <div class="grid grid-cols-2 gap-3">
              <!-- Google -->
              <button
                id="google-login"
                type="button"
                class="social-button h-12 border border-border bg-white rounded-dz text-sm font-semibold"
              >
                <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="#4285F4"
                    d="M21.35 12.23c0-.79-.07-1.55-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42Z"
                  />
                  <path
                    fill="#34A853"
                    d="M12 21.6c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.6Z"
                  />
                  <path
                    fill="#FBBC05"
                    d="M6.54 13.69a5.85 5.85 0 0 1 0-3.38V7.78H3.3a9.73 9.73 0 0 0 0 8.44l3.24-2.53Z"
                  />
                  <path
                    fill="#EA4335"
                    d="M12 6.28c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.34 14.63 2.4 12 2.4a9.74 9.74 0 0 0-8.7 5.38l3.24 2.53C7.31 8 9.46 6.28 12 6.28Z"
                  />
                </svg>

                Google
              </button>

              <!-- Apple -->
              <button
                id="apple-login"
                type="button"
                class="social-button h-12 border border-border bg-white rounded-dz text-sm font-semibold"
              >
                <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="#000000"
                    d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.1.8 1.21-.24 2.37-.93 3.66-.84 1.55.12 2.72.74 3.5 1.87-3.2 1.92-2.44 6.12.49 7.3-.59 1.55-1.35 3.06-2.75 3.84ZM12.05 7.25C11.9 4.95 13.77 3.05 15.93 2.85c.3 2.66-2.42 4.65-3.88 4.4Z"
                  />
                </svg>

                Apple
              </button>
            </div>
          </div>

          <!-- ========================= -->
          <!-- REGISTER -->
          <!-- ========================= -->

          <div id="register-panel" class="auth-panel hidden-panel">
            <form id="form-register" class="space-y-5">
              <!-- Email -->
              <div>
                <label
                  for="reg-email"
                  class="block mb-2 text-xs font-semibold font-mono uppercase tracking-wide"
                >
                  Email Address
                </label>

                <input
                  id="reg-email"
                  type="email"
                  autocomplete="email"
                  placeholder="newcollector@diecastzone.com"
                  required
                  class="w-full h-12 px-4 bg-surface border border-ink-black rounded-dz outline-none focus:border-primary focus:ring-1 focus:ring-primary transition"
                />
              </div>

              <!-- Password -->
              <div>
                <label
                  for="reg-password"
                  class="block mb-2 text-xs font-semibold font-mono uppercase tracking-wide"
                >
                  Password
                </label>

                <input
                  id="reg-password"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Create a password"
                  required
                  class="w-full h-12 px-4 bg-surface border border-ink-black rounded-dz outline-none focus:border-primary focus:ring-1 focus:ring-primary transition"
                />
              </div>

              <!-- Confirm -->
              <div>
                <label
                  for="reg-confirm-password"
                  class="block mb-2 text-xs font-semibold font-mono uppercase tracking-wide"
                >
                  Confirm Password
                </label>

                <input
                  id="reg-confirm-password"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Repeat password"
                  required
                  class="w-full h-12 px-4 bg-surface border border-ink-black rounded-dz outline-none focus:border-primary focus:ring-1 focus:ring-primary transition"
                />
              </div>

              <!-- Register -->
              <button
                id="register-submit"
                type="submit"
                class="w-full h-12 bg-ink-black hover:bg-gray-800 text-white font-mono text-sm font-semibold rounded-dz transition flex items-center justify-center"
              >
                CREATE ACCOUNT
              </button>
            </form>

            <!-- Divider -->

            <div class="flex items-center gap-3 my-6">
              <div class="h-px flex-1 bg-border"></div>

              <span
                class="text-[11px] text-gray-400 font-mono uppercase whitespace-nowrap"
              >
                Or register with
              </span>

              <div class="h-px flex-1 bg-border"></div>
            </div>

            <!-- Social Register -->

            <div class="grid grid-cols-2 gap-3">
              <!-- Google -->
              <button
                id="google-register"
                type="button"
                class="social-button h-12 border border-border bg-white rounded-dz text-sm font-semibold"
              >
                <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="#4285F4"
                    d="M21.35 12.23c0-.79-.07-1.55-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42Z"
                  />
                  <path
                    fill="#34A853"
                    d="M12 21.6c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.6Z"
                  />
                  <path
                    fill="#FBBC05"
                    d="M6.54 13.69a5.85 5.85 0 0 1 0-3.38V7.78H3.3a9.73 9.73 0 0 0 0 8.44l3.24-2.53 3.24 2.53Z"
                  />
                  <path
                    fill="#EA4335"
                    d="M12 6.28c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.34 14.63 2.4 12 2.4a9.74 9.74 0 0 0-8.7 5.38l3.24 2.53C7.31 8 9.46 6.28 12 6.28Z"
                  />
                </svg>

                Google
              </button>

              <!-- Apple -->
              <button
                id="apple-register"
                type="button"
                class="social-button h-12 border border-border bg-white rounded-dz text-sm font-semibold"
              >
                <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="#000000"
                    d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.1.8 1.21-.24 2.37-.93 3.66-.84 1.55.12 2.72.74 3.5 1.87-3.2 1.92-2.44 6.12.49 7.3-.59 1.55-1.35 3.06-2.75 3.84ZM12.05 7.25C11.9 4.95 13.77 3.05 15.93 2.85c.3 2.66-2.42 4.65-3.88 4.4Z"
                  />
                </svg>

                Apple
              </button>
            </div>

            <!-- Terms -->

            <p class="mt-6 text-xs text-center leading-5 text-secondary">
              By creating an account, you agree to our
              <a href="#" class="text-primary hover:underline">
                Terms of Service
              </a>
              and
              <a href="#" class="text-primary hover:underline">
                Privacy Policy </a
              >.
            </p>
          </div>
        </div>
      </section>
    </main>

    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer class="bg-ink-black border-t-4 border-primary">
      <div
        class="max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row md:items-center md:justify-between gap-5"
      >
        <div>
          <div
            class="font-mono text-xs font-semibold tracking-widest text-primary"
          >
            DIECAST ZONE
          </div>

          <p class="mt-2 text-xs text-gray-400">
            © 2026 DIECAST ZONE. ENGINEERED FOR COLLECTORS.
          </p>
        </div>

        <div class="flex flex-wrap gap-x-6 gap-y-2">
          <a href="#" class="text-xs text-gray-400 hover:text-white transition">
            About Us
          </a>

          <a href="#" class="text-xs text-gray-400 hover:text-white transition">
            Shipping Policy
          </a>

          <a href="#" class="text-xs text-gray-400 hover:text-white transition">
            Technical Specs
          </a>

          <a href="#" class="text-xs text-gray-400 hover:text-white transition">
            Contact Support
          </a>
        </div>
      </div>
    </footer>

    <!-- ========================= -->
    <!-- AUTH JS -->
    <!-- ========================= -->
    <script type="module" src="../js/config/firebase-config.js"></script>
    <script type="module" src="../js/auth.js"></script>
  </body>
</html>
